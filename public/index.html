<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pipe Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#FF5A36">
</head>
<body>
  <div class="pu-stage">
    <div class="pu-phone dotgrid">
      <div class="pu-notch"></div>
      <div class="pu-phone-scroll">
        <div class="pu-screen">
          <div class="pu-logo">PIPE<span> UP</span></div>
          <p class="pu-sub">one question · everyone answers · loudest laugh wins</p>

          <div id="rejoin" class="pu-stack" hidden></div>

          <div class="pu-card pu-namecard">
            <div class="pu-lbl">you're playing as</div>
            <input id="name" class="pu-input" placeholder="type your name" maxlength="18" autocomplete="off" />
          </div>

          <div class="pu-stack">
            <button id="create" class="pu-btn pu-btn-coral pu-btn-block">Create a room →</button>
          </div>

          <div class="pu-divider">or join</div>

          <div class="pu-card pu-stack">
            <div class="pu-lbl">got a room code?</div>
            <input id="code" class="pu-input pu-input-lg" placeholder="e.g. WXYZ" maxlength="4"
                   autocapitalize="characters" autocomplete="off" style="text-transform:uppercase" />
            <button id="join" class="pu-btn pu-btn-mint pu-btn-block">Join room →</button>
          </div>

          <p class="pu-hint pu-center pu-cta">No login. No app. Just open the link.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="/landing.js"></script>
</body>
</html>
